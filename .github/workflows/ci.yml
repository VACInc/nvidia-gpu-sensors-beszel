name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out and test.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA; Dependabot (.github/dependabot.yml) bumps it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Tests (no GPU needed)
        run: tests/run.sh

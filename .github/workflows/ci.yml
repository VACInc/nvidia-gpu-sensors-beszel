name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out and test.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA; Dependabot (.github/dependabot.yml) bumps it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (no GPU needed)
        run: tests/run.sh
